<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Centro Médico | Profesional</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/paciente-form.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="dashboard.html">
                Centro Médico
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="profesionales.html">
                            Profesionales
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-warning" href="index.html">
                            Cerrar sesión
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <main class="container py-5">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-4">

                <h1 class="fw-bold mb-4" id="tituloFormulario">
                    Registro de Profesional
                </h1>

                <form id="formProfesional" novalidate>

                    <div class="row g-4">

                        <div class="col-md-4">

                            <label class="form-label" for="matricula">
                                Matrícula *
                            </label>

                            <input
                                type="text"
                                id="matricula"
                                name="matricula"
                                class="form-control"
                                placeholder="Ej: MP-12345">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label" for="nombre">
                                Nombre *
                            </label>

                            <input
                                type="text"
                                id="nombre"
                                name="nombre"
                                class="form-control"
                                placeholder="Ingrese nombre">

                        </div>

                        <div class="col-md-4">

                            <label class="form-label" for="apellido">
                                Apellido *
                            </label>

                            <input
                                type="text"
                                id="apellido"
                                name="apellido"
                                class="form-control"
                                placeholder="Ingrese apellido">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label" for="especialidadId">
                                Especialidad *
                            </label>

                            <select class="form-select" id="especialidadId" name="especialidadId">
                                <option value="">Seleccionar</option>
                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label" for="activo">
                                Estado
                            </label>

                            <select class="form-select" id="activo" name="activo">
                                <option value="true">Activo</option>
                                <option value="false">Inactivo</option>
                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label" for="telefono">
                                Teléfono
                            </label>

                            <input
                                type="text"
                                id="telefono"
                                name="telefono"
                                class="form-control"
                                placeholder="3865 24-7452">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label" for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="form-control"
                                placeholder="correo@centromedico.com">

                        </div>

                    </div>

                    <div class="mt-5 d-flex gap-3">

                        <button type="submit" class="btn btn-primary">
                            Guardar
                        </button>

                        <a href="profesionales.html" class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </main>


    <footer class="bg-dark text-white text-center py-3 mt-5">

        <p class="mb-0">
            Centro Médico - Sistema de Gestión
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/profesional-form.js"></script>

</body>

</html>
