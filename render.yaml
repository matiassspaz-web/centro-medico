# La base de datos NO se declara aca a proposito: el plan gratuito de Render
# permite una sola, y ya existe (centro-medico-db). Los datos de conexion se
# cargan a mano como variables de entorno en el panel del servicio.
services:
  - type: web
    name: centro-medico
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
