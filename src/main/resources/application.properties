spring.application.name=centro-medico

# Conexion a la base. Los valores por defecto son los del entorno local;
# en el servidor se sobreescriben con variables de entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:centro_medico}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Gatitomimoso123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

jwt.secret=${JWT_SECRET:c2lzdGVtYS1jZW50cm8tbWVkaWNvLWNsYXZlLXNlY3JldGEtcGFyYS1maXJtYXItdG9rZW5zLWp3dC0yMDI2}
jwt.expiration-ms=28800000

server.port=${PORT:8080}
spring.web.resources.static-locations=classpath:/static/

logging.level.com.centromedico=INFO
